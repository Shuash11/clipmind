name: Build Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply ATL patch (flutter_secure_storage_windows)
        run: scripts/patch-atl.ps1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Verify release artifacts
        run: scripts/verify-release-artifacts.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: clipmind-windows-${{ github.sha }}
          path: build\windows\x64\runner\Release\
          if-no-files-found: error
