name: PR Checks

on:
  pull_request:
    branches: [ "opencode/clipmind-build", "feat/ci-workflow" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply ATL patch
        run: scripts/patch-atl.ps1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
