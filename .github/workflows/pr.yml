name: PR Checks

on:
  pull_request:
    branches: [ "opencode/clipmind-build", "feat/ci-workflow" ]

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Apply ATL patch
        run: scripts/patch-atl.ps1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
