name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Apply ATL patch
        run: scripts/patch-atl.ps1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Verify release artifacts and version
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: scripts/verify-release-artifacts.ps1 "$env:EXPECTED_VERSION"

      - name: Package portable zip
        run: |
          $ver = $env:GITHUB_REF_NAME
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\clipmind-windows-$ver.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        run: |
          $ver = "$env:GITHUB_REF_NAME".TrimStart("v")
          (Get-Content "installer\clipmind.iss") -replace '#define MyAppVersion ".+"', "#define MyAppVersion `"$ver`"" | Set-Content "installer\clipmind.iss"
          $patched = Get-Content "installer\clipmind.iss" -Raw
          if ($patched -notmatch ('#define MyAppVersion "' + [regex]::Escape($ver) + '"')) {
              throw "installer\clipmind.iss was not rewritten to version '$ver' — aborting installer build"
          }
          Write-Output "Installer version rewrite verified: $ver"
          iscc installer\clipmind.iss
        shell: pwsh

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMind-Setup
          path: build\installer\ClipMind-Setup-*.exe
          if-no-files-found: error

      - name: Compute version (strip leading v)
        id: ver
        shell: pwsh
        run: |
          $ver = "$env:GITHUB_REF_NAME".TrimStart("v")
          "ver=$ver" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipMind ${{ github.ref_name }}
          body: |
            **ClipMind ${{ github.ref_name }}**

            See [CHANGELOG](CHANGELOG.md) for details.

            ### Downloads
            - **Windows Installer** — `ClipMind-Setup-${{ steps.ver.outputs.ver }}.exe` (recommended)
            - **Portable ZIP** — `clipmind-windows-${{ github.ref_name }}.zip` (extract and run)
          # Note: GitHub auto-populates each asset's `digest`
          # (`sha256:<hex>`) server-side on upload — no workflow emission
          # step needed. The verifier contract is pinned by
          # test/unit/updates/release_digest_live_gate_test.dart.
          files: |
            build\installer\ClipMind-Setup-*.exe
            build\clipmind-windows-*.zip
