name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Apply ATL patch
        run: scripts/patch-atl.ps1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Zip the build
        run: |
          cd build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath "${{ github.workspace }}\clipmind-windows.zip"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipMind ${{ github.ref_name }}
          body: |
            **ClipMind ${{ github.ref_name }}**

            See [CHANGELOG](CHANGELOG.md) for details.

            ### Downloads
            - **Windows** — clipmind-windows.zip (extract and run clipmind.exe)
          files: clipmind-windows.zip
