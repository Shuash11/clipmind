name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Apply ATL patch
        run: scripts/patch-atl.ps1

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        run: iscc installer\clipmind.iss
        shell: pwsh

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMind-Setup
          path: build\installer\ClipMind-Setup-*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipMind ${{ github.ref_name }}
          body: |
            **ClipMind ${{ github.ref_name }}**

            See [CHANGELOG](CHANGELOG.md) for details.

            ### Downloads
            - **Windows Installer** — `ClipMind-Setup-${{ github.ref_name }}.exe` (run to install)
            - **Portable ZIP** — `clipmind-windows.zip` (extract and run clipmind.exe)
          files: |
            build\installer\ClipMind-Setup-*.exe
            build\windows\x64\runner\Release\clipmind.exe
